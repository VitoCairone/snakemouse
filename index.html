<!DOCTYPE html>
<html lang="en">
<head>
    <title>Snake & Mouse</title>
</head>
<body>
  <h1>Press any arrow key</h1>

  <script>
    document.addEventListener('keyup', function(event) {
      switch (event.key) {
        case 'ArrowUp':
          alert('Up');
          break;
        case 'ArrowDown':
          alert('Down');
          break;
        case 'ArrowLeft':
          alert('Left');
          break;
        case 'ArrowRight':
          alert('Right');
          break;
        default:
          // Do nothing for other keys
          break;
      }
    });
  </script>
</body>
</html>
